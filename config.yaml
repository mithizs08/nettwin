# NetTwin configuration. All scripts read from here; no seeds or paths hardcoded elsewhere.

seeds:
  global: 42
  topology_split: 1001
  scenarios: 2002
  training: 3003
  agent_eval_sampling: 4004
  kg_services: 5005
  network: 6006                # per-topology demand weights and capacities (fixed across scenarios)

paths:
  data: data
  raw: data/raw
  scenarios: data/scenarios
  kg: data/kg
  scenarios_demo: data/scenarios/phase2_demo
  models: data/models
  results: results
  figures: results/figures
  runbooks: src/nettwin/agent/runbooks

topologies:
  train_generator: gabriel     # topohub keys gabriel/<n>/<seed>
  train_n_range: [15, 60]
  test:
    - topozoo/Aarnet
    - topozoo/Geant2012
    - sndlib/germany50
  skip:                        # failed to load in this environment
    - topozoo/GtsCe
    - topozoo/Cogentco
  use_names: true

kg:
  ecmp_max_paths: 4            # cap on equal-cost paths kept per PoP pair
  fibre_km_per_ms: 200.0       # propagation in fibre, about 5 us per km
  services_per_pop: 2          # synthetic customer services = this x number of PoPs
  service_classes:             # synthetic SLA tiers; sla_latency = prop latency x factor + margin
    gold:   {share: 0.2, latency_factor: 1.2, latency_margin_ms: 1.0, loss_pct: 0.1}
    silver: {share: 0.3, latency_factor: 1.5, latency_margin_ms: 2.0, loss_pct: 0.5}
    bronze: {share: 0.5, latency_factor: 2.0, latency_margin_ms: 5.0, loss_pct: 1.0}

simulator:
  step_minutes: 5
  days: 7
  warmup_days: 1               # no faults or maintenance in the first day (baselines need history)
  target_peak_utilisation: [0.4, 0.7]
  capacity_floor_frac: 0.25    # lightly used links get at least this fraction of the median capacity
  hot_links:                   # normal-peak distractor: some links run close to capacity at every evening peak
    frac: 0.1
    target_utilisation: [0.8, 0.95]
  n1_planning:                 # some links are also sized for the worst single-link failure (partial N-1 planning)
    planned_frac: 0.5
    target_utilisation: [0.75, 1.0]
    peak_steps: 24             # busiest history steps used to estimate failure loads
  demand:
    total: 1000.0              # arbitrary traffic units summed over all PoP pairs
    node_weight_sigma: 0.8     # gravity model: weight = degree x lognormal(0, sigma)
    diurnal_amplitude: 0.6     # trough is (1 - amplitude) of the daily peak
    trough_hour: 4.5           # local time of the daily minimum
    weekend_factor: 0.85
    ar_phi: 0.9                # AR(1) log-noise per directed demand
    ar_sigma: 0.04
    day_factor_sigma: 0.04     # per-PoP per-day traffic level
  latency:
    per_hop_ms: 0.02
    queue_scale_ms: 0.05       # queueing = scale x rho / (1 - rho), capped at buffer_ms
    buffer_ms: 25.0
    jitter_rel: 0.02
    jitter_abs_ms: 0.05
    outlier_prob: 0.001        # probe artefacts: +1 to 20 ms
  loss:
    knee: 0.9                  # congestion loss is negligible below this utilisation
    at_capacity_pct: 0.2
    counter_noise_rel: 0.1
    background_prob: 0.02      # random small discard counts on healthy links
    background_mean_pct: 0.005
  probes_per_step: 600         # end-to-end probes per service per 5 min; loss is binomial
  util_noise: 0.003
  missing_prob: 0.003
  drain_metric: 1000000

faults:                        # severity ranges; sampled per fault
  max_per_scenario: 3
  min_gap_steps: 36
  link_down:         {duration_steps: [3, 72]}
  node_down:         {duration_steps: [2, 24]}
  link_degradation:  {duration_steps: [12, 288], loss_pct: [0.01, 2.0], silent_prob: 0.5, ramp_steps: [0, 36], burst_sigma: 0.7}
  link_flapping:     {duration_steps: [6, 48], active_prob: [0.1, 0.9], max_down_frac: [0.01, 0.5], flaps_per_step: [0.5, 6], convergence_s: [0.05, 1.0]}
  demand_surge:      {duration_steps: [6, 72], factor: [1.3, 4.0], ramp_steps: [1, 6]}
  routing_misconfig: {duration_steps: [12, 576], metric_factor: [1.3, 10.0], minimal_prob: 0.5}   # log-uniform factor, or the smallest change that shifts any pair

distractors:
  maintenance_per_scenario: [1, 3]
  maintenance_duration_steps: [6, 48]
  maintenance_actions: {drain: 0.5, down: 0.3, noop: 0.2}
  maintenance_start_hours: [0, 4]    # sim-time hour of day; windows are overnight
  maintenance_max_util: 0.85         # change review: skip a drain / outage that would congest a link
  gaps_per_scenario: [1, 4]
  gap_duration_steps: [1, 24]
  gap_pop_scope_prob: 0.5      # else a single link
  event_day_prob: 0.3          # whole-network traffic day, e.g. a big public event
  event_day_factor: [1.1, 1.25]

impact:                        # thresholds for labelling a fault subtle / moderate / obvious (noise-free deltas)
  affected_latency_ms: 0.5
  affected_loss_pct: 0.05

agent:
  # Set before Phase 6 from the current Anthropic docs. Do not fill from memory.
  dev_model: null
  eval_model: null
  max_tool_calls: 15
  max_tokens_per_incident: null
