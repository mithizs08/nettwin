# NetTwin configuration. All scripts read from here; no seeds or paths hardcoded elsewhere.

seeds:
  global: 42
  topology_split: 1001
  scenarios: 2002
  training: 3003
  agent_eval_sampling: 4004
  kg_services: 5005
  network: 6006                # per-topology demand weights and capacities (fixed across scenarios)
  reserved_ranges:             # scenario seeds already viewed; dataset builders must not reuse them (audit m12)
    - [99, 99]                 # Phase 2 misconfig candidate probe
    - [2026, 2026]             # Phase 2 AARNet demo
    - [3000, 3001]
    - [4040, 4040]
    - [5000, 5002]
    - [7000, 7507]             # Phase 2 diagnostics (first round)
    - [8000, 8999]             # post-audit diagnostics and demos

paths:
  data: data
  raw: data/raw
  scenarios: data/scenarios
  kg: data/kg
  scenarios_demo: data/scenarios/phase2_demo
  models: data/models
  results: results
  figures: results/figures
  runbooks: src/nettwin/agent/runbooks

topologies:
  dev:                         # seen during development (audit C1): demo only, own results column
    - topozoo/Aarnet
  test:                        # never touched for design decisions
    - topozoo/Geant2012
    - sndlib/germany50
    - topozoo/Garr201201       # the next five picked by the pre-registered rule (scripts/select_topologies.py)
    - topozoo/Peer1
    - topozoo/York
    - topozoo/Belnet2010
    - topozoo/Ibm
  validation_real:             # picked by the same rule
    - topozoo/Aconet
    - topozoo/BeyondTheNetwork
    - topozoo/Fccn
    - topozoo/Quest
    - topozoo/Nextgen
  reference_pool_file: results/topology_selection.json   # augmentation parameters only
  synthetic:                   # topohub Gabriel generator plus augmentation (src/nettwin/synth.py)
    prefix: gabaug
    count: 400
    n_range: [15, 60]
    seed_base: 1000000         # outside topohub's shipped scheme (i * 4096 + n)
    val_frac: 0.25
    split_seed: 7171
  skip:
    - topozoo/GtsCe            # failed to load in this environment
    - topozoo/Cogentco         # failed to load in this environment
    # near-duplicates of test networks (audit L13); never train, validation or reference
    - topozoo/Geant2001        # GEANT, earlier snapshots of test Geant2012
    - topozoo/Geant2009
    - topozoo/Geant2010
    - sndlib/geant
    - topozoo/Dfn              # German research network, overlaps test germany50
    - sndlib/dfn-bwin
    - sndlib/dfn-gwin
    - sndlib/nobel-germany     # same German network family as germany50
    - sndlib/nobel-eu          # same NOBEL project, skipped to be conservative
    - sndlib/nobel-us
    # older snapshots of test networks Garr201201 and Belnet2010 (audit re-verify N5)
    - topozoo/Garr199901
    - topozoo/Garr199904
    - topozoo/Garr199905
    - topozoo/Garr200109
    - topozoo/Garr200112
    - topozoo/Garr200212
    - topozoo/Garr200404
    - topozoo/Garr200902
    - topozoo/Garr200908
    - topozoo/Garr200909
    - topozoo/Garr200912
    - topozoo/Garr201001
    - topozoo/Garr201003
    - topozoo/Garr201004
    - topozoo/Garr201005
    - topozoo/Garr201007
    - topozoo/Garr201008
    - topozoo/Garr201010
    - topozoo/Garr201012
    - topozoo/Garr201101
    - topozoo/Garr201102
    - topozoo/Garr201103
    - topozoo/Garr201104
    - topozoo/Garr201105
    - topozoo/Garr201107
    - topozoo/Garr201108
    - topozoo/Garr201109
    - topozoo/Garr201110
    - topozoo/Garr201111
    - topozoo/Garr201112
    - topozoo/Belnet2003
    - topozoo/Belnet2004
    - topozoo/Belnet2005
    - topozoo/Belnet2006
    - topozoo/Belnet2007
    - topozoo/Belnet2008
    - topozoo/Belnet2009
  use_names: true

kg:
  ecmp_max_paths: 4            # cap on equal-cost paths kept per PoP pair
  fibre_km_per_ms: 200.0       # propagation in fibre, about 5 us per km
  services_per_pop: 2          # synthetic customer services = this x number of PoPs
  service_classes:             # synthetic SLA tiers; sla_latency = prop latency x factor + margin
    gold:   {share: 0.2, latency_factor: 1.2, latency_margin_ms: 1.0, loss_pct: 0.1}
    silver: {share: 0.3, latency_factor: 1.5, latency_margin_ms: 2.0, loss_pct: 0.5}
    bronze: {share: 0.5, latency_factor: 2.0, latency_margin_ms: 5.0, loss_pct: 1.0}

simulator:
  step_minutes: 5
  days: 7
  warmup_days: 1               # no faults or maintenance in the first day (baselines need history)
  target_peak_utilisation: [0.4, 0.7]
  capacity_floor_frac: 0.25    # lightly used links get at least this fraction of the median capacity
  hot_links:                   # normal-peak distractor: some links run close to capacity at every evening peak
    frac: 0.1
    target_utilisation: [0.8, 0.95]
  n1_planning:                 # some links are also sized for the worst single-link failure (partial N-1 planning)
    planned_frac: 0.5
    target_utilisation: [0.75, 1.0]
    peak_steps: 24             # busiest history steps used to estimate failure loads
  demand:
    total: 1000.0              # arbitrary traffic units summed over all PoP pairs
    node_weight_sigma: 0.8     # gravity model: weight = degree x lognormal(0, sigma)
    diurnal_amplitude: 0.6     # trough is (1 - amplitude) of the daily peak
    trough_hour: 4.5           # local time of the daily minimum
    weekend_factor: 0.85
    ar_phi: 0.9                # AR(1) log-noise per directed demand
    ar_sigma: 0.04
    day_factor_sigma: 0.04     # per-PoP per-day traffic level
  latency:
    per_hop_ms: 0.02
    queue_scale_ms: 0.05       # queueing = scale x rho / (1 - rho), capped at buffer_ms
    buffer_ms: 25.0
    jitter_rel: 0.02
    jitter_abs_ms: 0.05
    outlier_prob: 0.001        # probe artefacts: +1 to 20 ms
  loss:
    knee: 0.9                  # congestion loss is negligible below this utilisation
    at_capacity_pct: 0.2
    counter_noise_rel: 0.1
    background_prob: 0.02      # random small discard counts on healthy links
    background_mean_pct: 0.005
  probes_per_step: 600         # end-to-end probes per service per 5 min; loss is binomial
  probe_background:            # healthy end-to-end probe loss (audit C2); see decision log for the rate
    base_rate: [1.0e-5, 2.0e-4]  # per-service, log-uniform: 0.001% to 0.02% of probes
    episodes_per_day: 0.3      # bursty probe-host / ICMP rate-limit artefacts
    episode_mean_steps: 3
    episode_loss: [0.0005, 0.01] # 0.05% to 1% during an episode
  probe_missing_prob: 0.005    # one-hop probe timeouts on healthy links (latency missing, counters present)
  status:                      # polling and NMS reachability (audit M6, M1)
    lag_probs: [0.5, 0.35, 0.15] # report lag of 0, 1, 2 steps
    missed_poll_prob: 0.1      # one extra step
    pop_status_prob: 0.8       # NMS raises 'unreachable' for a router it cannot poll
    pop_timeout_polls: [1, 3]
  carried_iterations: 4        # per-path fixed point for traffic dropped upstream (audit M3)
  gray_goodput_knee_pct: 0.5   # above this gray loss, TCP goodput falls as 1/sqrt(loss)
  util_noise: 0.003
  missing_prob: 0.003
  drain_metric: 1000000

faults:                        # severity ranges; sampled per fault
  max_per_scenario: 3
  min_gap_steps: 36
  link_down:         {duration_steps: [3, 72], convergence_s: [0.05, 1.0]}
  node_down:         {duration_steps: [2, 24], convergence_s: [0.05, 1.0]}
  link_degradation:  {duration_steps: [12, 288], loss_pct: [0.005, 1.0], silent_prob: 0.5, ramp_steps: [0, 36], ramp_down_steps: [0, 24], burst_sigma: 0.7}
  link_flapping:     {duration_steps: [6, 48], active_prob: [0.1, 0.9], max_down_frac: [0.005, 0.15], flaps_per_step: [0.2, 4], convergence_s: [0.02, 0.5]}
  demand_surge:      {duration_steps: [6, 72], factor: [1.1, 3.0], ramp_steps: [1, 6], ramp_down_steps: [0, 12]}
  routing_misconfig: {duration_steps: [12, 576], metric_factor: [1.3, 10.0], minimal_prob: 0.7}   # log-uniform factor, or the smallest change that shifts any pair

distractors:
  maintenance_per_scenario: [1, 3]
  maintenance_duration_steps: [6, 48]
  maintenance_actions: {drain: 0.5, down: 0.3, noop: 0.2}
  maintenance_start_hours: [0, 4]    # sim-time hour of day; windows are overnight
  maintenance_max_util: 0.85         # change review: skip a drain / outage that would congest a link
  maintenance_review_margin: 1.15    # planning margin on the noise-free check (audit m3)
  maintenance_daytime_prob: 0.15     # some changes happen in business hours (audit M2)
  maintenance_daytime_hours: [9, 17]
  overlap_maintenance_prob: 0.15     # fault placed during or just after a change window (audit M2)
  caused_by_maintenance_prob: 0.5    # ... and on the maintained element
  concurrent_prob: 0.1               # fault placed during another fault
  probe_gaps_per_scenario: [1, 4]    # one-hop probe responder outages (latency missing only)
  gap_responder_down_prob: 0.5       # a PoP outage also kills its probe responder: probes to it are lost
  gaps_per_scenario: [1, 4]
  gap_duration_steps: [1, 24]
  gap_pop_scope_prob: 0.5      # else a single link
  event_day_prob: 0.3          # whole-network traffic day, e.g. a big public event
  event_day_factor: [1.1, 1.25]

impact:                        # thresholds on noise-free deltas vs the counterfactual (latency relative: audit M4)
  affected_latency_rel: 0.02
  affected_loss_pct: 0.05
  subtle_latency_rel: 0.02
  obvious_latency_rel: 0.25
  util_delta: 0.009            # 3 sigma of util noise (observability, labels)
  latency_rel: 0.06            # 3x latency jitter
  counter_delta_pct: 0.01      # above background discard noise

dataset:                       # Phase 3 (src/nettwin/dataset.py, scripts/phase3_build_dataset.py)
  root: data/datasets/v1
  scenarios_per_topology:
    train: 4                   # x 308 generated train graphs
    val_generated: 4           # x 92 generated validation graphs
    validation_real: 20        # x 5 networks
    test: 30                   # x 7 networks
    dev: 30                    # AARNet, seen during development
  seed_base:                   # disjoint per split, far from every reserved range
    train: 20000000
    val: 21000000
    test: 22000000
    dev: 23000000

agent:
  # From platform.claude.com/docs/en/about-claude/pricing, checked 2026-10-31 (USD per million tokens, standard tier,
  # global routing). Cache reads on Opus 5.5 are 0.05x input. Haiku 5.5 prices double+ above 100,000 prompt tokens.
  # Pre-test design change 2026-10-31 (decision log): whole-project API spend must stay under project_budget_usd.
  dev_model: claude-haiku-5-5        # development and debugging (validation only)
  eval_model: claude-haiku-5-5       # main eval: A0, A1, A2 on validation and test (same model, so differences come from the tools)
  secondary_eval_model: claude-opus-5-5   # secondary result: A0 and A2 on test only
  secondary_conditions: [A0, A2]
  project_budget_usd: 100
  pricing_usd_per_mtok:
    claude-haiku-5-5: {input: 0.10, cache_write_5m: 0.125, cache_read: 0.01, output: 0.50, input_over_100k: 0.50, output_over_100k: 2.50}
    claude-opus-5-5: {input: 4.00, cache_write_5m: 5.00, cache_read: 0.20, output: 20.00}
    claude-sonnet-5-5: {input: 2.00, cache_write_5m: 2.50, cache_read: 0.10, output: 10.00}
  pricing_checked: "2026-10-31"
  effort: medium                     # output_config.effort; both models default to medium, set explicitly
  max_tool_calls: 15
  max_tokens_per_incident: 120000    # input + output tokens over the whole loop; the loop stops and forces a diagnosis
  max_output_tokens_per_turn: 4000
